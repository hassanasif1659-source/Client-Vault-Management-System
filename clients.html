<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientVault - Clients</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="page" id="page">

        <!-- Search and filters -->
        <div class="toolbar">
            <label class="search" id="searchWrap">
                <input type="text" id="searchBox" placeholder="Search by ID, name, phone, email or city...">
            </label>
            <select id="statusFilter">
                <option value="">All Status</option>
                <option>Active</option>
                <option>Inactive</option>
                <option>Pending</option>
            </select>
            <select id="typeFilter">
                <option value="">All Types</option>
                <option>Individual</option>
                <option>Business</option>
                <option>Corporate</option>
                <option>Freelancer</option>
            </select>
            <span class="count" id="countLabel"></span>
            <a href="addclient.html" class="btn btn-gold">+ Add Client</a>
        </div>

        <!-- Client table -->
        <div class="table-card">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Client ID</th>
                            <th>Client</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Registered</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="clientRows">
                        <tr><td colspan="8" class="empty">Loading clients...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pager">
                <span id="pageInfo"></span>
                <div class="pager-btns">
                    <button id="prevBtn">&larr; Previous</button>
                    <button id="nextBtn">Next &rarr;</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Pop-up: View client -->
    <div class="modal-bg" id="viewModal">
        <div class="modal">
            <div class="modal-head"><h3>Client Details</h3><button class="icon-btn" data-close data-icon="x"></button></div>
            <div class="modal-body" id="viewBody"></div>
            <div class="modal-foot">
                <button class="btn btn-ghost" id="viewEditBtn">Update</button>
                <button class="btn btn-gold" data-close>Close</button>
            </div>
        </div>
    </div>

    <!-- Pop-up: Update client -->
    <div class="modal-bg" id="editModal">
        <form class="modal" id="editForm">
            <div class="modal-head"><h3>Update Client</h3><button type="button" class="icon-btn" data-close data-icon="x"></button></div>
            <div class="modal-body">
                <div class="form-grid">
                    <div class="field"><label>Client ID</label><input id="editId" readonly></div>
                    <div class="field"><label>Full Name</label><input id="editName"></div>
                    <div class="field"><label>Phone</label><input id="editPhone"></div>
                    <div class="field"><label>Email</label><input id="editEmail" type="email"></div>
                    <div class="field full"><label>Address</label><input id="editAddress"></div>
                    <div class="field"><label>Registration Date</label><input id="editDate" type="date"></div>
                    <div class="field"><label>Client Type</label>
                        <select id="editType"><option>Individual</option><option>Business</option><option>Corporate</option><option>Freelancer</option></select></div>
                    <div class="field"><label>Status</label>
                        <select id="editStatus"><option>Active</option><option>Inactive</option><option>Pending</option></select></div>
                </div>
                <p class="error-text" id="editError"></p>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn btn-ghost" data-close>Cancel</button>
                <button type="submit" class="btn btn-gold">Save Changes</button>
            </div>
        </form>
    </div>

    <!-- Pop-up: Delete client -->
    <div class="modal-bg" id="deleteModal">
        <div class="modal" style="max-width:420px; text-align:center">
            <div class="modal-body">
                <div class="warn-icon" data-icon="trash"></div>
                <h3 style="margin:0 0 8px">Delete this client?</h3>
                <p style="color:var(--muted); margin:0" id="deleteText"></p>
            </div>
            <div class="modal-foot" style="justify-content:center">
                <button class="btn btn-ghost" data-close>Cancel</button>
                <button class="btn btn-danger" id="confirmDelete">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="Clients.js"></script>
</body>
</html>
