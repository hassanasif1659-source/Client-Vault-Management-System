

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Vault - Add Client</title>
    <link rel="stylesheet" href="Clients.css">
    <style>
        form { max-width: 500px; }
        label { display: block; margin-bottom: 6px; }
        form input, form select { width: 100%; box-sizing: border-box; }
        button { background: #4fd1c5; color: #0b1418; font-weight: bold;
                 padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; }
        select { padding: 10px; margin-bottom: 20px; border: 1px solid #4fd1c5;
                 border-radius: 8px; background: #0b1418; color: #e6f1f5; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h2 class="logo">Client Vault</h2>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="addclient.html">+ Add Client</a></li>
            <li><a href="clients.html">Clients List</a></li>
            <li><a href="index.html">Logout</a></li>
        </ul>
    </nav>

    <div class="list-container">
        <h1>Add New Client</h1>
        <form>
            <label>Client ID</label>
            <input type="text" placeholder="CL-0201">

            <label>Full Name</label>
            <input type="text">

            <label>Phone</label>
            <input type="text">

            <label>Email</label>
            <input type="email">

            <label>Address</label>
            <input type="text">

            <label>Registration Date</label>
            <input type="date">

            <label>Client Type</label>
            <select>
                <option>Individual</option>
                <option>Business</option>
                <option>Corporate</option>
                <option>Freelancer</option>
            </select>

            <label>Status</label>
            <select>
                <option>Active</option>
                <option>Inactive</option>
                <option>Pending</option>
            </select>

            <button type="submit">Save Client</button>
        </form>
    </div>
</body>
</html>
